<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f4"><meta name="description" content="A clean personal finance dashboard for tracking spending, budgets, savings and bills."><title>Finance · Personal Finance</title><link rel="stylesheet" href="css/styles.css?v=20261026-auto-page-entrance1"><style>#boot-status{max-width:640px;margin:15vh auto;padding:24px;border-radius:16px;background:#fff;color:#17251f;font:16px/1.6 system-ui,sans-serif;box-shadow:0 8px 30px #1e39260b}#boot-status h1{margin-top:0;font-size:22px}#boot-status p{margin-bottom:0}#boot-status[hidden]{display:none}</style><script>window.addEventListener("error",function(e){var b=document.getElementById("boot-status");if(b&&document.getElementById("app")&&!document.getElementById("app").children.length){b.hidden=false;b.innerHTML="<h1>Finance लोड नहीं हो पाया</h1><p>JavaScript में त्रुटि आई है: "+String(e.message||"अज्ञात त्रुटि").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})+"</p><p>पेज को दोबारा लोड करें। समस्या बनी रहे तो यह संदेश सपोर्ट के लिए उपयोग करें।</p>"}},true);window.setTimeout(function(){var b=document.getElementById("boot-status"),a=document.getElementById("app");if(b&&a&&!a.children.length){b.hidden=false;b.innerHTML="<h1>Finance लोड होने में समस्या</h1><p>वेबसाइट की JavaScript शुरू नहीं हुई या पुरानी कैश फाइल लोड हुई है। Chrome में पेज रीफ़्रेश करें।</p>"}},6000)</script></head><body data-page="dashboard"><div id="boot-status"><h1>Finance लोड हो रहा है…</h1><p>डैशबोर्ड तैयार किया जा रहा है।</p></div><div id="app"></div><script src="js/app.js?v=20261026-mobile-header-rows2"></script></body></html>
